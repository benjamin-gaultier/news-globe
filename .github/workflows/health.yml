name: Health

# Every hour: check the live site, then add the latest published run to the
# history archive (a fallback once the Pi archives after each run, with
# ARCHIVE_AFTER_RUN=1: a run it already archived is skipped). A failed run makes GitHub email whoever last changed this
# schedule (and anyone watching Actions), so stale data, a dark country or a
# broken archive is noticed within the hour. Both live in one job to keep
# Actions minutes down (the repo is private).
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Check the live site
        run: node .github/scripts/check-health.mjs
        env:
          # Override with a repository variable to check another deployment.
          SITE_URL: ${{ vars.SITE_URL }}

      # Built here from the published data rather than on the ingest machine, so
      # history keeps growing whatever code that machine runs.
      - run: pnpm install --frozen-lockfile --filter @news-globe/ingest...
        if: ${{ !cancelled() }}
      - name: Archive the latest run
        if: ${{ !cancelled() }}
        run: pnpm --filter @news-globe/ingest archive:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The NEWS_DATA namespace in apps/web/wrangler.jsonc.
          CLOUDFLARE_KV_NAMESPACE_ID: deb7c288814748e393a3e6a801824f6d
          # Optional: Azure AI Translator (free F0 tier) for /data/translations.json.
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
