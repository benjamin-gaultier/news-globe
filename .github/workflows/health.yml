name: Health

# Checks the live site every hour. A failed run makes GitHub email whoever last
# changed this schedule (and anyone watching Actions), so stale data or a dark
# country is noticed within the hour. The report is on each run's summary page.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node .github/scripts/check-health.mjs
        env:
          # Override with a repository variable to check another deployment.
          SITE_URL: ${{ vars.SITE_URL }}
