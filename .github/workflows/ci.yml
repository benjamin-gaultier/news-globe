name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy main by hand (Actions → CI → Run workflow), e.g. after adding a country.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, but never cut a deploy short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # vite build only: `pnpm build` would typecheck the web app a second time.
      - run: pnpm --filter @news-globe/web exec vite build

  # The globe in a real browser (Playwright, software WebGL): clicks, hovers and the camera.
  # Always on main (deploys wait for it). On a PR only when it touches what the browser tests
  # cover, as they take most of CI's Actions minutes (the repo is private): otherwise the job
  # passes at once, so a required `e2e` check still resolves.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide whether the browser tests run
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/web/e2e/|apps/web/playwright\.config\.ts|apps/web/vite\.config\.ts|apps/web/index\.html|apps/web/package\.json|pnpm-lock\.yaml|apps/web/src/(App\.tsx|main\.tsx|styles\.css|components/(GlobeView|PanelShell|NewsPanel)\.tsx|hooks/|lib/route\.ts)|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No change the browser tests cover: skipped (they run on main before deploying)."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.run == 'true'
      - run: pnpm --filter @news-globe/web exec playwright install --with-deps chromium
        if: steps.scope.outputs.run == 'true'
      - run: pnpm --filter @news-globe/web e2e
        if: steps.scope.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # The front end and Worker go live only from main, and only once `check` and `e2e` have passed.
  # The news data is not part of this: the Pi publishes it to KV on its own schedule.
  deploy:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/operations.md → Deploy)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @news-globe/web exec vite build
      - run: pnpm --filter @news-globe/web exec wrangler deploy
